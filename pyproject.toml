[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-capped-agent"
version = "0.1.0"
description = "Claude agent that answers questions over a codebase and docs, with model routing, prompt caching and hard cost caps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Ranges for anyone installing this as a library; requirements.txt pins the exact versions it's tested with.
dependencies = [
    "anthropic>=2.3.0,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[project.scripts]
costagent = "costagent.cli:main"

[tool.setuptools]
packages = ["costagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=costagent --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["costagent/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
# Prompt and tool-description prose: wrapping it would add line breaks the model reads.
"costagent/agent.py" = ["E501"]
