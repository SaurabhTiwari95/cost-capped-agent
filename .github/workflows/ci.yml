name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pre-publish check (private words, IPs, emails, phones, AWS ids)
        env:
          BLOCKED_WORDS: ${{ secrets.BLOCKED_WORDS }}
        run: python scripts/prepublish_check.py
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements-dev.txt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (no network, no API key, no cost), coverage gate 80%
        run: pytest --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build; runs as non-root; indexes and searches offline
        run: |
          docker build -t cost-capped-agent:ci .
          test "$(docker run --rm --entrypoint id cost-capped-agent:ci -u)" = "10001"
          docker volume create agentdata
          docker run --rm -v agentdata:/data --read-only cost-capped-agent:ci index sample_corpus
          docker run --rm -v agentdata:/data --read-only cost-capped-agent:ci search "early payment discount" | grep payment-terms

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .github "./**/*.md"
          fail: true
